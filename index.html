<!DOCTYPEhtml>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PINK Perfumaria - Catálogo Virtual</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cabeçalho / Banner -->
  <header class="header">
    <div class="logo-container">
      <h1 class="brand-title">PINK <span>PERFUMARIA</span></h1>
      <p class="brand-subtitle">Catálogo de Produtos & Pronta Entrega</p>
    </div>
  </header>

  <!-- Barra de Busca -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Buscar por perfume, body splash...">
  </div>

  <!-- Navegação por Categoria -->
  <nav class="categories-nav">
    <button class="btn-filtro" data-categoria="Desodorantes">🧴 Desodorantes</button>
    <button class="cat-btn active" data-category="Todos">Todos</button>
    <button class="cat-btn" data-category="Perfumaria">🌸 Perfumaria</button>
    <button class="cat-btn" data-category="Corporal">✨ Corporal</button>
    <button class="cat-btn" data-category="Capilar">💇‍♀️ Capilar</button>
    <button class="cat-btn" data-category="Facial">🧴 Facial</button>
    <button class="cat-btn" data-category="Promoções">🔥 Promoções</button>
  </nav>

  <!-- Grid de Produtos -->
  <main class="catalog-container">
    <div id="productGrid" class="product-grid">
      <!-- Cards serão injetados via JavaScript -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
