<!DOCTYPEhtml>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PINK Perfumaria - Catálogo Virtual</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cabeçalho / Banner -->
  <header class="header">
  <div class="brand-container">
    <img src="logo.png" alt="Logo Pink Perfumaria" class="brand-logo">
    <h1 class="brand-title">PINK <span>PERFUMARIA</span></h1>
  </div>
  <p class="brand-subtitle">Catálogo de Produtos & Pronta Entrega</p>
</header>

  <!-- Barra de Busca -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Buscar por perfume, body splash...">
  </div>

<!-- Navegação por Categoria -->
  <div class="categories-nav">
  <button class="cat-btn active" data-category="Todos">✨ Todos</button>
  <button class="cat-btn" data-category="Perfumaria">🌸 Perfumaria</button>
  <button class="cat-btn" data-category="Body Splash">💖 Body Splash</button>
  <button class="cat-btn" data-category="Hidratantes">🧴 Hidratantes</button>
  <button class="cat-btn" data-category="Óleos">✨ Óleos Corporais</button>
  <button class="cat-btn" data-category="Desodorantes">🛡️ Desodorantes</button>
  <button class="cat-btn" data-category="Capilar">💇‍♀️ Capilar</button>
  <button class="cat-btn" data-category="Facial">💆‍♀️ Facial</button>
  <button class="cat-btn" data-category="Kits">🎁 Kits</button>
</div>
  <!-- Grid de Produtos -->
  <main class="catalog-container">
    <div id="productGrid" class="product-grid">
      <!-- Cards serão injetados via JavaScript -->
    </div>
  </main>

  <script src="script.js"></script>
  <!-- Botão Flutuante do Carrinho -->
<button id="floatingCartBtn" class="floating-cart-btn" onclick="toggleCartModal()">
  🛒
  <span id="cartCountBadge" class="cart-badge">0</span>
</button>

<!-- Modal do Carrinho -->
<div id="cartModalOverlay" class="cart-modal-overlay" onclick="closeCartOnOverlay(event)">
  <div class="cart-modal">
    <div class="cart-header">
      <h2>Seu Carrinho 🛍️</h2>
      <button class="cart-close-btn" onclick="toggleCartModal()">&times;</button>
    </div>
    
    <div id="cartItemsContainer" class="cart-items">
      <!-- Os itens do carrinho serão renderizados aqui via JavaScript -->
    </div>

    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total:</span>
        <strong id="cartTotalValue">R$ 0,00</strong>
      </div>
      <button class="btn-checkout-wa" onclick="sendCartToWhatsApp()">
        Concluir Pedido no WhatsApp 💬
      </button>
    </div>
  </div>
</div>
</body>
</html>
